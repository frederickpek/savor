name: ingest + picks + deploy

on:
  schedule:
    # Every 6 hours (00:17, 06:17, 12:17, 18:17 SGT): ingest Beli, rate 150 more places, publish.
    # New picks are written on the first run of each week (Monday SGT); the rest keep them.
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        type: choice
        options: [ingest, rerank-only, deploy-only]
        default: ingest
      score_budget:
        description: 'Places to fetch Beli ratings for this run (default 150, ~7 min; higher risks 429s)'
        required: false
        default: ''
  # Any push to master that touches the app, the pipeline or prefs redeploys the site.
  push:
    branches: [master]
    paths: ['web/**', 'pipeline/**', 'prefs.json', '.github/workflows/deploy.yml']

permissions:
  contents: write   # push the data branch
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      exit: ${{ steps.run.outputs.exit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so a push can diff against the previous commit for prefs.json

      # The SQLite DB, raw snapshots and reports live on an orphan `data` branch; first run starts empty.
      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach data-store FETCH_HEAD
          else
            mkdir data-store
          fi

      - uses: actions/setup-python@v5
        if: inputs.mode != 'deploy-only'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Pushes to master re-publish from the stored DB without calling Beli. Only a prefs.json
      # change rebuilds this week's picks; code and UI pushes keep them as they are.
      - name: Ingest and rank
        id: run
        if: inputs.mode != 'deploy-only'
        env:
          BELI_EMAIL: ${{ secrets.BELI_EMAIL }}
          BELI_PASSWORD: ${{ secrets.BELI_PASSWORD }}
          ONEMAP_TOKEN: ${{ secrets.ONEMAP_TOKEN }}
          SAVOR_SCORE_BUDGET: ${{ inputs.score_budget }}
        run: |
          pip install -q -r pipeline/requirements.txt
          skip=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.mode }}" = "rerank-only" ]; then skip="--skip-ingest"; fi
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null | grep -qx prefs.json; then
            skip="$skip --keep-picks"
          fi
          set +e
          python -m pipeline.run --out data-store --status-file status.json $skip
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          [ -f status.md ] && cat status.md >> "$GITHUB_STEP_SUMMARY"
          [ -f status.json ] && echo "Status: $(jq -r .status status.json)" >> "$GITHUB_STEP_SUMMARY"
          # Publish whatever was written even on failure; the job goes red at the end.
          [ -f data-store/api/index.json ]

      - name: Publish data branch (single commit, so the branch never accumulates history)
        if: inputs.mode != 'deploy-only'
        working-directory: data-store
        run: |
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(jq -r .generatedAt api/index.json)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Only the derived api/ folder is deployed. The DB, raw snapshots and reports stay on the
      # data branch and are never served by Pages.
      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build
          if [ -d ../data-store/api ]; then
            mkdir -p dist/data && cp -r ../data-store/api dist/data/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail if the core Beli lists could not be ingested
        if: needs.build.outputs.exit != '' && needs.build.outputs.exit != '0'
        run: |
          echo "::error::Ingest failed (Beli catalogue unavailable, or login rejected). Picks were re-ranked from stored data. See the build job summary."
          exit 1
